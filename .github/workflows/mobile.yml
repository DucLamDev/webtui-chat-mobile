name: Mobile CI and release

on:
  workflow_dispatch:
    inputs:
      bootstrap_version:
        description: SemVer for the first Play App Signing bootstrap AAB
        required: true
        default: "1.0.0"
        type: string
      confirm_play_signing_bootstrap:
        description: Type INTERNAL_ONLY_DO_NOT_PROMOTE to build the bootstrap AAB
        required: true
        type: string
  pull_request:
  push:
    branches: [main, master]
    tags: ["mobile-v*"]

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.9

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Gradle 8.14 / Kotlin 2.2 không chạy được với Java 25 mặc định của runner: dùng Java 17 như dự án.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --set-exit-if-changed lib test integration_test tool
      - run: dart run tool/check_architecture.dart
      - run: dart run tool/check_mobile_release.dart
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --flavor dev -t lib/main_dev.dart

  android-release:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: app/release.jks
      WEBTUI_ANDROID_COMPILE_SDK: "36"
      WEBTUI_ANDROID_TARGET_SDK: "36"
      FIREBASE_API_KEY: ${{ secrets.MOBILE_FIREBASE_API_KEY || vars.MOBILE_FIREBASE_API_KEY }}
      FIREBASE_MESSAGING_SENDER_ID: "595077870179"
      FIREBASE_PROJECT_ID: webtui-chat
      FIREBASE_ANDROID_APP_ID: "1:595077870179:android:a6f4ff5cc14a0d1485be56"
      FIREBASE_IOS_APP_ID: ${{ vars.MOBILE_FIREBASE_IOS_APP_ID }}
      WEBTUI_APP_LINK_HOST: ${{ vars.MOBILE_APP_LINK_HOST }}
      # Always-on publisher reference/reviewer instance. Customer instances are
      # selected at runtime; legacy MOBILE_API_BASE_URL remains a fallback.
      WEBTUI_REFERENCE_INSTANCE_URL: ${{ vars.MOBILE_REFERENCE_INSTANCE_URL || vars.MOBILE_API_BASE_URL }}
      WEBTUI_API_BASE_URL: ${{ vars.MOBILE_REFERENCE_INSTANCE_URL || vars.MOBILE_API_BASE_URL }}
      WEBTUI_PRIVACY_POLICY_URL: ${{ vars.MOBILE_PRIVACY_POLICY_URL }}
      WEBTUI_TERMS_URL: ${{ vars.MOBILE_TERMS_URL }}
      WEBTUI_TERMS_VERSION: ${{ vars.MOBILE_TERMS_VERSION }}
      WEBTUI_PRIVACY_VERSION: ${{ vars.MOBILE_PRIVACY_VERSION }}
      WEBTUI_ACCOUNT_DELETION_URL: ${{ vars.MOBILE_ACCOUNT_DELETION_URL }}
      WEBTUI_SUPPORT_URL: ${{ vars.MOBILE_SUPPORT_URL }}
      PLAY_APP_SIGNING_SHA256_FINGERPRINTS: ${{ vars.PLAY_APP_SIGNING_SHA256_FINGERPRINTS }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Gradle 8.14 / Kotlin 2.2 không chạy được với Java 25 mặc định của runner: dùng Java 17 như dự án.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Restore Android signing key
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
      - name: Validate Android signing key
        run: |
          if ! keytool -list -keystore android/app/release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 must be the base64 content of android/app/upload-keystore.jks, and ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_ALIAS must match that keystore."
            exit 1
          fi
      - run: flutter pub get --enforce-lockfile
      - name: Validate production configuration
        run: dart run tool/check_production_config.dart --platform=android
      - name: Validate public production endpoints
        run: dart run tool/check_public_release_endpoints.dart --platform=android
      - name: Build signed Android releases
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#mobile-v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # Reserve two decimal digits for reruns so a later workflow run can
          # never collide with a retried versionCode from the previous run.
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          test "$BUILD_NUMBER" -le 2100000000
          mkdir -p release
          DEFINES=(
            --dart-define="WEBTUI_APP_VERSION=$VERSION"
            --dart-define=WEBTUI_RELEASE_CHANNEL=stable
            --dart-define=WEBTUI_RELEASE_SERVICE_URL=https://download.webtui.vn
            --dart-define="WEBTUI_API_BASE_URL=$WEBTUI_API_BASE_URL"
            --dart-define="WEBTUI_PRIVACY_POLICY_URL=$WEBTUI_PRIVACY_POLICY_URL"
            --dart-define="WEBTUI_TERMS_URL=$WEBTUI_TERMS_URL"
            --dart-define="WEBTUI_TERMS_VERSION=$WEBTUI_TERMS_VERSION"
            --dart-define="WEBTUI_PRIVACY_VERSION=$WEBTUI_PRIVACY_VERSION"
            --dart-define="WEBTUI_ACCOUNT_DELETION_URL=$WEBTUI_ACCOUNT_DELETION_URL"
            --dart-define="WEBTUI_SUPPORT_URL=$WEBTUI_SUPPORT_URL"
            --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY"
            --dart-define="FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"
            --dart-define="FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            --dart-define="FIREBASE_ANDROID_APP_ID=$FIREBASE_ANDROID_APP_ID"
            --dart-define="FIREBASE_IOS_APP_ID=$FIREBASE_IOS_APP_ID"
          )
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -1)"
          test -x "$APKANALYZER"
          flutter build appbundle --release --flavor prod -t lib/main_prod.dart --build-name "$VERSION" --build-number "$BUILD_NUMBER" "${DEFINES[@]}"
          flutter build apk --release --flavor prod -t lib/main_prod.dart --build-name "$VERSION" --build-number "$BUILD_NUMBER" "${DEFINES[@]}"
          cp build/app/outputs/flutter-apk/app-prod-release.apk release/app-prod-release.apk
          cp build/app/outputs/bundle/prodRelease/app-prod-release.aab release/app-prod-release.aab
          if [ -f build/app/outputs/native-debug-symbols/prodRelease/native-debug-symbols.zip ]; then
            cp build/app/outputs/native-debug-symbols/prodRelease/native-debug-symbols.zip release/native-debug-symbols.zip
          fi
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 release/app-prod-release.apk
          MANIFEST="$(find build/app/intermediates/merged_manifests/prodRelease -name AndroidManifest.xml | head -1)"
          test -f "$MANIFEST"
          dart run tool/check_android_manifest.dart "$MANIFEST"
          jarsigner -verify release/app-prod-release.aab | tee release/aab-signing-verification.txt
          grep -F 'jar verified.' release/aab-signing-verification.txt
          "$APKANALYZER" files list release/app-prod-release.aab | tee release/aab-file-list.txt
          grep -Eq 'libapp\.so\.(sym|dbg)$' release/aab-file-list.txt
          grep -Eq 'libflutter\.so\.(sym|dbg)$' release/aab-file-list.txt
          dart run tool/check_android_elf_alignment.dart release/app-prod-release.apk
          sha256sum release/app-prod-release.apk > release/app-prod-release.apk.sha256
          sha256sum release/app-prod-release.aab > release/app-prod-release.aab.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-production-${{ github.ref_name }}
          path: |
            release/app-prod-release.aab
            release/app-prod-release.aab.sha256
            release/aab-signing-verification.txt
            release/aab-file-list.txt
            release/native-debug-symbols.zip
          if-no-files-found: error
          retention-days: 30
      # The upload-key APK is used only for checks inside this job and is not
      # uploaded or published. With the recommended Play App Signing setup, the
      # upload key differs from the app-signing key; distributing this APK would
      # create an install base that cannot update to Play-delivered APKs. A
      # public fallback must be exported from Play (or be independently verified
      # to use the exact Play app-signing certificate).

  android-play-signing-bootstrap:
    # This one-time manual path only breaks the Play App Signing fingerprint
    # chicken/egg. It is deliberately separate from the releasable tag job.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirm_play_signing_bootstrap == 'INTERNAL_ONLY_DO_NOT_PROMOTE'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: app/release.jks
      WEBTUI_ANDROID_COMPILE_SDK: "36"
      WEBTUI_ANDROID_TARGET_SDK: "36"
      FIREBASE_API_KEY: ${{ secrets.MOBILE_FIREBASE_API_KEY || vars.MOBILE_FIREBASE_API_KEY }}
      FIREBASE_MESSAGING_SENDER_ID: "595077870179"
      FIREBASE_PROJECT_ID: webtui-chat
      FIREBASE_ANDROID_APP_ID: "1:595077870179:android:a6f4ff5cc14a0d1485be56"
      FIREBASE_IOS_APP_ID: ${{ vars.MOBILE_FIREBASE_IOS_APP_ID }}
      WEBTUI_APP_LINK_HOST: ${{ vars.MOBILE_APP_LINK_HOST }}
      WEBTUI_REFERENCE_INSTANCE_URL: ${{ vars.MOBILE_REFERENCE_INSTANCE_URL || vars.MOBILE_API_BASE_URL }}
      WEBTUI_API_BASE_URL: ${{ vars.MOBILE_REFERENCE_INSTANCE_URL || vars.MOBILE_API_BASE_URL }}
      WEBTUI_PRIVACY_POLICY_URL: ${{ vars.MOBILE_PRIVACY_POLICY_URL }}
      WEBTUI_TERMS_URL: ${{ vars.MOBILE_TERMS_URL }}
      WEBTUI_TERMS_VERSION: ${{ vars.MOBILE_TERMS_VERSION }}
      WEBTUI_PRIVACY_VERSION: ${{ vars.MOBILE_PRIVACY_VERSION }}
      WEBTUI_ACCOUNT_DELETION_URL: ${{ vars.MOBILE_ACCOUNT_DELETION_URL }}
      WEBTUI_SUPPORT_URL: ${{ vars.MOBILE_SUPPORT_URL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Gradle 8.14 / Kotlin 2.2 không chạy được với Java 25 mặc định của runner: dùng Java 17 như dự án.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Restore permanent Android upload key
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
      - name: Validate permanent Android upload key
        run: |
          if ! keytool -list -keystore android/app/release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 must be the base64 content of android/app/upload-keystore.jks, and ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_ALIAS must match that keystore."
            exit 1
          fi
      - run: flutter pub get --enforce-lockfile
      - name: Validate Internal-only Play signing bootstrap configuration
        run: dart run tool/check_production_config.dart --platform=android --play-signing-bootstrap
      - name: Build and verify signed Internal-only bootstrap AAB
        env:
          BOOTSTRAP_VERSION: ${{ github.event.inputs.bootstrap_version }}
        run: |
          [[ "$BOOTSTRAP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_RUN_ATTEMPT" -le 99
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          test "$BUILD_NUMBER" -le 2100000000
          mkdir -p release
          DEFINES=(
            --dart-define="WEBTUI_APP_VERSION=$BOOTSTRAP_VERSION"
            --dart-define=WEBTUI_RELEASE_CHANNEL=stable
            --dart-define=WEBTUI_RELEASE_SERVICE_URL=https://download.webtui.vn
            --dart-define="WEBTUI_API_BASE_URL=$WEBTUI_API_BASE_URL"
            --dart-define="WEBTUI_PRIVACY_POLICY_URL=$WEBTUI_PRIVACY_POLICY_URL"
            --dart-define="WEBTUI_TERMS_URL=$WEBTUI_TERMS_URL"
            --dart-define="WEBTUI_TERMS_VERSION=$WEBTUI_TERMS_VERSION"
            --dart-define="WEBTUI_PRIVACY_VERSION=$WEBTUI_PRIVACY_VERSION"
            --dart-define="WEBTUI_ACCOUNT_DELETION_URL=$WEBTUI_ACCOUNT_DELETION_URL"
            --dart-define="WEBTUI_SUPPORT_URL=$WEBTUI_SUPPORT_URL"
            --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY"
            --dart-define="FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"
            --dart-define="FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            --dart-define="FIREBASE_ANDROID_APP_ID=$FIREBASE_ANDROID_APP_ID"
            --dart-define="FIREBASE_IOS_APP_ID=$FIREBASE_IOS_APP_ID"
          )
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -1)"
          test -x "$APKANALYZER"
          flutter build appbundle --release --flavor prod -t lib/main_prod.dart --build-name "$BOOTSTRAP_VERSION" --build-number "$BUILD_NUMBER" "${DEFINES[@]}"
          flutter build apk --release --flavor prod -t lib/main_prod.dart --build-name "$BOOTSTRAP_VERSION" --build-number "$BUILD_NUMBER" "${DEFINES[@]}"
          cp build/app/outputs/bundle/prodRelease/app-prod-release.aab release/app-prod-play-signing-bootstrap-INTERNAL-ONLY.aab
          if [ -f build/app/outputs/native-debug-symbols/prodRelease/native-debug-symbols.zip ]; then
            cp build/app/outputs/native-debug-symbols/prodRelease/native-debug-symbols.zip release/native-debug-symbols-play-signing-bootstrap-INTERNAL-ONLY.zip
          fi
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$ZIPALIGN"
          "$ZIPALIGN" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-prod-release.apk
          MANIFEST="$(find build/app/intermediates/merged_manifests/prodRelease -name AndroidManifest.xml | head -1)"
          test -f "$MANIFEST"
          dart run tool/check_android_manifest.dart "$MANIFEST"
          jarsigner -verify release/app-prod-play-signing-bootstrap-INTERNAL-ONLY.aab | tee release/bootstrap-aab-signing-verification.txt
          grep -F 'jar verified.' release/bootstrap-aab-signing-verification.txt
          "$APKANALYZER" files list release/app-prod-play-signing-bootstrap-INTERNAL-ONLY.aab | tee release/bootstrap-aab-file-list.txt
          grep -Eq 'libapp\.so\.(sym|dbg)$' release/bootstrap-aab-file-list.txt
          grep -Eq 'libflutter\.so\.(sym|dbg)$' release/bootstrap-aab-file-list.txt
          dart run tool/check_android_elf_alignment.dart build/app/outputs/flutter-apk/app-prod-release.apk
          sha256sum release/app-prod-play-signing-bootstrap-INTERNAL-ONLY.aab > release/app-prod-play-signing-bootstrap-INTERNAL-ONLY.aab.sha256
          printf '%s\n' \
            'INTERNAL-ONLY PLAY APP SIGNING BOOTSTRAP.' \
            'DO NOT PROMOTE THIS ARTIFACT TO CLOSED, OPEN, OR PRODUCTION.' \
            'After Play issues the app-signing SHA-256, configure association files and build a new versionCode through the tagged release job.' \
            > release/DO-NOT-PROMOTE-PLAY-SIGNING-BOOTSTRAP.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-play-signing-bootstrap-INTERNAL-ONLY-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/app-prod-play-signing-bootstrap-INTERNAL-ONLY.aab
            release/app-prod-play-signing-bootstrap-INTERNAL-ONLY.aab.sha256
            release/DO-NOT-PROMOTE-PLAY-SIGNING-BOOTSTRAP.txt
            release/bootstrap-aab-signing-verification.txt
            release/bootstrap-aab-file-list.txt
            release/native-debug-symbols-play-signing-bootstrap-INTERNAL-ONLY.zip
          if-no-files-found: error
          retention-days: 7
      # No Play upload action belongs here. An authorized operator may upload
      # this AAB manually to Internal testing only, then must build a fresh
      # versionCode with android-release after the association gate is complete.

  ios-archive-check:
    # Android/Play is the first production target. Enable this independent
    # unsigned iOS gate only after the Apple identifiers are provisioned.
    if: startsWith(github.ref, 'refs/tags/mobile-v') && vars.ENABLE_IOS_RELEASE_CHECK == 'true'
    needs: verify
    runs-on: macos-latest
    environment: production
    env:
      FIREBASE_API_KEY: ${{ secrets.MOBILE_FIREBASE_API_KEY || vars.MOBILE_FIREBASE_API_KEY }}
      FIREBASE_MESSAGING_SENDER_ID: "595077870179"
      FIREBASE_PROJECT_ID: webtui-chat
      FIREBASE_ANDROID_APP_ID: "1:595077870179:android:a6f4ff5cc14a0d1485be56"
      FIREBASE_IOS_APP_ID: ${{ vars.MOBILE_FIREBASE_IOS_APP_ID }}
      WEBTUI_PRIVACY_POLICY_URL: ${{ vars.MOBILE_PRIVACY_POLICY_URL }}
      # Always-on publisher reference/reviewer instance. Customer instances are
      # selected at runtime; legacy MOBILE_API_BASE_URL remains a fallback.
      WEBTUI_REFERENCE_INSTANCE_URL: ${{ vars.MOBILE_REFERENCE_INSTANCE_URL || vars.MOBILE_API_BASE_URL }}
      WEBTUI_API_BASE_URL: ${{ vars.MOBILE_REFERENCE_INSTANCE_URL || vars.MOBILE_API_BASE_URL }}
      WEBTUI_APP_LINK_HOST: ${{ vars.MOBILE_APP_LINK_HOST }}
      WEBTUI_TERMS_URL: ${{ vars.MOBILE_TERMS_URL }}
      WEBTUI_TERMS_VERSION: ${{ vars.MOBILE_TERMS_VERSION }}
      WEBTUI_PRIVACY_VERSION: ${{ vars.MOBILE_PRIVACY_VERSION }}
      WEBTUI_ACCOUNT_DELETION_URL: ${{ vars.MOBILE_ACCOUNT_DELETION_URL }}
      WEBTUI_SUPPORT_URL: ${{ vars.MOBILE_SUPPORT_URL }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_BUNDLE_ID: com.vpsttt.webtuiChat
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Select Xcode 26 (iPhoneOS 26 SDK)
        run: |
          set -euo pipefail
          # Runner có nhiều bản Xcode; chọn bản 26 chính thức mới nhất thay vì bản mặc định của image.
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)"
          if [ -n "$XCODE_APP" ]; then sudo xcode-select -s "$XCODE_APP/Contents/Developer"; fi
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $SDK_VERSION"
          grep -Eq '^26\.' <<<"$SDK_VERSION"
      - run: flutter pub get --enforce-lockfile
      - name: Require production runtime configuration
        run: dart run tool/check_production_config.dart --platform=ios
      - name: Validate public production endpoints
        run: dart run tool/check_public_release_endpoints.dart --platform=ios
      - name: Build unsigned production iOS app
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#mobile-v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          test "$BUILD_NUMBER" -le 2100000000
          flutter build ios --release --no-codesign -t lib/main_prod.dart \
            --build-name "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --dart-define="WEBTUI_APP_VERSION=$VERSION" \
            --dart-define=WEBTUI_RELEASE_CHANNEL=stable \
            --dart-define=WEBTUI_RELEASE_SERVICE_URL=https://download.webtui.vn \
            --dart-define="WEBTUI_API_BASE_URL=$WEBTUI_API_BASE_URL" \
            --dart-define="WEBTUI_PRIVACY_POLICY_URL=$WEBTUI_PRIVACY_POLICY_URL" \
            --dart-define="WEBTUI_TERMS_URL=$WEBTUI_TERMS_URL" \
            --dart-define="WEBTUI_TERMS_VERSION=$WEBTUI_TERMS_VERSION" \
            --dart-define="WEBTUI_PRIVACY_VERSION=$WEBTUI_PRIVACY_VERSION" \
            --dart-define="WEBTUI_ACCOUNT_DELETION_URL=$WEBTUI_ACCOUNT_DELETION_URL" \
            --dart-define="WEBTUI_SUPPORT_URL=$WEBTUI_SUPPORT_URL" \
            --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY" \
            --dart-define="FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define="FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
            --dart-define="FIREBASE_ANDROID_APP_ID=$FIREBASE_ANDROID_APP_ID" \
            --dart-define="FIREBASE_IOS_APP_ID=$FIREBASE_IOS_APP_ID"

  ios-release:
    # Signed IPA + TestFlight upload. Runs entirely on a GitHub-hosted macOS
    # runner, so no local Mac is required. Enable only after the Apple signing
    # assets and App Store Connect API key exist in the production environment.
    if: startsWith(github.ref, 'refs/tags/mobile-v') && vars.ENABLE_IOS_RELEASE == 'true'
    needs: verify
    runs-on: macos-latest
    environment: production
    env:
      FIREBASE_API_KEY: ${{ secrets.MOBILE_FIREBASE_API_KEY || vars.MOBILE_FIREBASE_API_KEY }}
      FIREBASE_MESSAGING_SENDER_ID: "595077870179"
      FIREBASE_PROJECT_ID: webtui-chat
      FIREBASE_ANDROID_APP_ID: "1:595077870179:android:a6f4ff5cc14a0d1485be56"
      FIREBASE_IOS_APP_ID: ${{ vars.MOBILE_FIREBASE_IOS_APP_ID }}
      WEBTUI_PRIVACY_POLICY_URL: ${{ vars.MOBILE_PRIVACY_POLICY_URL }}
      # Always-on publisher reference/reviewer instance. Customer instances are
      # selected at runtime; legacy MOBILE_API_BASE_URL remains a fallback.
      WEBTUI_REFERENCE_INSTANCE_URL: ${{ vars.MOBILE_REFERENCE_INSTANCE_URL || vars.MOBILE_API_BASE_URL }}
      WEBTUI_API_BASE_URL: ${{ vars.MOBILE_REFERENCE_INSTANCE_URL || vars.MOBILE_API_BASE_URL }}
      WEBTUI_APP_LINK_HOST: ${{ vars.MOBILE_APP_LINK_HOST }}
      WEBTUI_TERMS_URL: ${{ vars.MOBILE_TERMS_URL }}
      WEBTUI_TERMS_VERSION: ${{ vars.MOBILE_TERMS_VERSION }}
      WEBTUI_PRIVACY_VERSION: ${{ vars.MOBILE_PRIVACY_VERSION }}
      WEBTUI_ACCOUNT_DELETION_URL: ${{ vars.MOBILE_ACCOUNT_DELETION_URL }}
      WEBTUI_SUPPORT_URL: ${{ vars.MOBILE_SUPPORT_URL }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_BUNDLE_ID: com.vpsttt.webtuiChat
      APPLE_PROVISIONING_PROFILE_NAME: ${{ vars.APPLE_PROVISIONING_PROFILE_NAME }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Select Xcode 26 (iPhoneOS 26 SDK)
        run: |
          set -euo pipefail
          # Runner có nhiều bản Xcode; chọn bản 26 chính thức mới nhất thay vì bản mặc định của image.
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)"
          if [ -n "$XCODE_APP" ]; then sudo xcode-select -s "$XCODE_APP/Contents/Developer"; fi
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $SDK_VERSION"
          grep -Eq '^26\.' <<<"$SDK_VERSION"
      - name: Import Apple distribution certificate
        env:
          APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_DISTRIBUTION_CERT_P12_BASE64"
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          printf '%s' "$APPLE_DISTRIBUTION_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          rm -f "$CERT_PATH"
      - name: Install App Store provisioning profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_PROVISIONING_PROFILE_BASE64"
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/webtui_appstore.mobileprovision"
      - name: Generate signing xcconfig and ExportOptions.plist
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_PROVISIONING_PROFILE_NAME"
          {
            echo "CODE_SIGN_STYLE = Manual"
            echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
            echo "PROVISIONING_PROFILE_SPECIFIER = $APPLE_PROVISIONING_PROFILE_NAME"
            echo "CODE_SIGN_IDENTITY = Apple Distribution"
            echo "CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution"
          } > ios/Flutter/Signing.xcconfig
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APPLE_BUNDLE_ID</key><string>$APPLE_PROVISIONING_PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>stripSwiftSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
      - run: flutter pub get --enforce-lockfile
      - name: Require production runtime configuration
        run: dart run tool/check_production_config.dart --platform=ios
      - name: Validate public production endpoints
        run: dart run tool/check_public_release_endpoints.dart --platform=ios
      - name: Build signed production IPA
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION#mobile-v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          test "$BUILD_NUMBER" -le 2100000000
          {
            echo "IOS_VERSION=$VERSION"
            echo "IOS_BUILD_NUMBER=$BUILD_NUMBER"
          } >> "$GITHUB_ENV"
          # Dự án iOS chỉ có scheme Runner (không có flavor): không dùng --flavor.
          flutter build ipa --release -t lib/main_prod.dart \
            --build-name "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --export-options-plist ios/ExportOptions.plist \
            --dart-define="WEBTUI_APP_VERSION=$VERSION" \
            --dart-define=WEBTUI_RELEASE_CHANNEL=stable \
            --dart-define=WEBTUI_RELEASE_SERVICE_URL=https://download.webtui.vn \
            --dart-define="WEBTUI_API_BASE_URL=$WEBTUI_API_BASE_URL" \
            --dart-define="WEBTUI_PRIVACY_POLICY_URL=$WEBTUI_PRIVACY_POLICY_URL" \
            --dart-define="WEBTUI_TERMS_URL=$WEBTUI_TERMS_URL" \
            --dart-define="WEBTUI_TERMS_VERSION=$WEBTUI_TERMS_VERSION" \
            --dart-define="WEBTUI_PRIVACY_VERSION=$WEBTUI_PRIVACY_VERSION" \
            --dart-define="WEBTUI_ACCOUNT_DELETION_URL=$WEBTUI_ACCOUNT_DELETION_URL" \
            --dart-define="WEBTUI_SUPPORT_URL=$WEBTUI_SUPPORT_URL" \
            --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY" \
            --dart-define="FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define="FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
            --dart-define="FIREBASE_ANDROID_APP_ID=$FIREBASE_ANDROID_APP_ID" \
            --dart-define="FIREBASE_IOS_APP_ID=$FIREBASE_IOS_APP_ID"
      - name: Upload build to TestFlight and wait for processing
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          IOS_RELEASE_NOTES: ${{ vars.IOS_RELEASE_NOTES || 'Cải thiện hiệu năng và sửa lỗi.' }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_API_PRIVATE_KEY_BASE64"
          command -v fastlane >/dev/null || gem install fastlane --no-document
          IOS_IPA_PATH="$(find "$GITHUB_WORKSPACE/build/ios/ipa" -name '*.ipa' | head -1)"
          test -f "$IOS_IPA_PATH"
          export IOS_IPA_PATH
          cd ios && fastlane upload_testflight
      - name: Submit the build for App Store review
        # Bật bằng biến IOS_SUBMIT_FOR_REVIEW=true sau khi phiên bản đầu tiên đã được duyệt / điền đủ thông tin
        # (ảnh, mô tả, quyền riêng tư, xếp hạng tuổi) trên App Store Connect.
        if: vars.IOS_SUBMIT_FOR_REVIEW == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          IOS_RELEASE_NOTES: ${{ vars.IOS_RELEASE_NOTES || 'Cải thiện hiệu năng và sửa lỗi.' }}
          IOS_AUTOMATIC_RELEASE: ${{ vars.IOS_AUTOMATIC_RELEASE || 'false' }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          set -euo pipefail
          cd ios && fastlane submit_review
      - name: Collect IPA artifact
        run: |
          set -euo pipefail
          mkdir -p release
          IPA_PATH="$(find build/ios/ipa -name '*.ipa' | head -1)"
          cp "$IPA_PATH" release/
          shasum -a 256 release/*.ipa > release/ios-ipa.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-production-${{ github.ref_name }}
          path: |
            release/*.ipa
            release/ios-ipa.sha256
          if-no-files-found: error
          retention-days: 14
